<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý Trung tâm - Extra Center</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
            },
            tealAccent: {
              500: '#0d9488',
              600: '#0f766e',
            }
          }
        }
      }
    }
  </script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen">

  <!-- ==================== TOAST NOTIFICATION CONTAINER ==================== -->
  <div id="toastContainer" class="fixed top-5 right-5 z-[9999] flex flex-col gap-2 pointer-events-none"></div>

  <!-- ==================== LOGIN SCREEN ==================== -->
  <div id="loginScreen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gradient-to-br from-emerald-50 via-teal-50/70 to-slate-100 overflow-y-auto">
    <div class="bg-white/95 backdrop-blur-md rounded-3xl p-8 sm:p-10 w-full max-w-[420px] shadow-2xl shadow-emerald-500/10 border border-emerald-100/60 flex flex-col items-center">
      
      <!-- Graduation Cap Icon -->
      <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-500 flex items-center justify-center text-white shadow-lg shadow-teal-500/30 mb-5">
        <i class="fa-solid fa-graduation-cap text-3xl"></i>
      </div>

      <!-- Heading -->
      <h1 class="text-2xl sm:text-[26px] font-extrabold text-slate-800 tracking-tight text-center">Quản lý Trung tâm</h1>
      <p class="text-xs sm:text-sm text-slate-400 mt-1 mb-8 text-center font-medium">Đăng nhập để tiếp tục</p>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="handleLogin(event)" class="w-full space-y-5">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1.5 uppercase tracking-wider">Email</label>
          <div class="relative">
            <input 
              type="text" 
              id="loginEmail" 
              required
              placeholder="giao_vien@email.com" 
              class="w-full px-4 py-3 bg-white border border-slate-200 rounded-2xl text-sm focus:outline-none focus:border-teal-500 focus:ring-4 focus:ring-teal-500/10 transition font-medium"
            >
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1.5 uppercase tracking-wider">PIN</label>
          <div class="relative">
            <input 
              type="password" 
              id="loginPin" 
              required
              placeholder="Nhập PIN của bạn" 
              class="w-full px-4 py-3 bg-white border border-slate-200 rounded-2xl text-sm focus:outline-none focus:border-teal-500 focus:ring-4 focus:ring-teal-500/10 transition font-medium tracking-widest"
            >
          </div>
        </div>

        <button 
          type="submit" 
          id="btnLoginSubmit"
          class="w-full py-3.5 px-4 rounded-2xl bg-gradient-to-r from-teal-500 to-emerald-600 hover:from-teal-600 hover:to-emerald-700 text-white font-bold text-sm shadow-lg shadow-emerald-500/25 hover:shadow-emerald-500/40 active:scale-[0.99] transition-all flex items-center justify-center gap-2 mt-2"
        >
          <span>🔐</span>
          <span>Đăng nhập</span>
        </button>
      </form>

      <!-- Quick Mock Test Accounts Helper -->
      <div class="w-full mt-6 pt-5 border-t border-slate-100">
        <p class="text-[11px] font-semibold uppercase tracking-wider text-slate-400 text-center mb-2.5">Tài khoản mẫu thử nhanh</p>
        <div class="grid grid-cols-2 gap-2">
          <button type="button" onclick="fillTestAccount('admin@extra.edu.vn', '1234')" class="p-2 rounded-xl bg-slate-50 hover:bg-emerald-50 border border-slate-200/80 hover:border-emerald-300 text-left transition group">
            <div class="text-[11px] font-bold text-slate-700 group-hover:text-emerald-700">Admin</div>
            <div class="text-[10px] text-slate-400 font-mono">PIN: 1234</div>
          </button>
          <button type="button" onclick="fillTestAccount('giaovien@extra.edu.vn', '5678')" class="p-2 rounded-xl bg-slate-50 hover:bg-emerald-50 border border-slate-200/80 hover:border-emerald-300 text-left transition group">
            <div class="text-[11px] font-bold text-slate-700 group-hover:text-emerald-700">Giáo viên</div>
            <div class="text-[10px] text-slate-400 font-mono">PIN: 5678</div>
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- ==================== MAIN DASHBOARD CONTAINER ==================== -->
  <div id="mainApp" class="hidden min-h-screen flex flex-col md:flex-row">
    <!-- Sidebar -->
